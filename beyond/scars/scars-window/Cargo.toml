[package]
name = "scars-window"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Native macOS windows and Skia-on-Metal rendering for SCARS"
publish = false

[dependencies]
raw-window-handle = "0.6.2"
skia-safe.workspace = true
scars-ui = { path = "../scars-ui" }

[target.'cfg(target_os = "macos")'.dependencies]
# Upstream also uses binary-cache's archive support to fetch source dependencies.
# FORCE_SKIA_BUILD in .cargo/config.toml forbids downloading prebuilt libraries.
skia-safe = { workspace = true, features = ["metal"] }
objc2 = "0.6.5"
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2-foundation = "0.3.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std", "block2", "objc2-quartz-core", "objc2-core-foundation",
    "NSApplication", "NSWindow", "NSPanel", "NSView", "NSResponder",
    "NSMenu", "NSMenuItem", "NSButton", "NSButtonCell", "NSControl", "NSCell",
    "NSImage", "NSAppearance", "NSTitlebarAccessoryViewController", "NSViewController",
    "NSLayoutConstraint", "NSEvent", "NSTrackingArea", "NSGraphics", "NSCursor",
    "NSPasteboard", "NSRunningApplication", "NSTextInputClient", "NSTextInputContext",
    "NSAccessibility", "NSAccessibilityProtocols", "NSAccessibilityElement", "NSAccessibilityConstants",
    "NSWorkspace", "NSUserInterfaceValidation", "NSGraphicsContext",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "CAMetalLayer", "CADisplayLink", "CATransaction", "objc2-metal", "objc2-core-foundation", "block2"] }
objc2-metal = "0.3.2"

[[test]]
name = "desktop"
path = "tests/desktop.rs"
harness = false

