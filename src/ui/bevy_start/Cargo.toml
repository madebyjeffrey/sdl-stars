[package]
name = "stars_bevy_start"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
bevy = { version = "=0.20.0", default-features = false, features = ["std", "default_app", "ui_bevy_render", "default_font", "mouse", "keyboard", "multi_threaded"] }
raw-window-handle = "0.6.2"

[profile.dev]
debug = 1

[profile.release]
debug = 1
