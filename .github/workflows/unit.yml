name: Stars unit tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install SDL build and test dependencies
        run: |
          sudo apt-get update
          # Keep SDL's optional desktop backends buildable; see docs/SDL3-DEVELOPMENT.md.
          sudo apt-get install -y cmake ninja-build pkg-config python3-pip python3-venv python3-yaml \
            libfreetype-dev libfontconfig-dev libcairo2-dev zlib1g-dev libwmf-bin \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libdrm-dev libgbm-dev libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libvulkan-dev libdbus-1-dev libibus-1.0-dev libudev-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            xvfb xauth openbox x11-utils poppler-utils cups-client
      - name: Build and run SDL unit and wrapper tests
        run: |
          cmake --preset sdl-debug
          cmake --build --preset sdl-debug --parallel 2 -- -k 0
          ctest --preset sdl-headless -LE tutorial-partial

  resource-sanitizers:
    name: Resource ownership (ASan/UBSan/LSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install SDL build and test dependencies
        run: |
          sudo apt-get update
          # Keep SDL's optional desktop backends buildable; see docs/SDL3-DEVELOPMENT.md.
          sudo apt-get install -y cmake ninja-build pkg-config python3-pip python3-venv python3-yaml \
            libfreetype-dev libfontconfig-dev libcairo2-dev zlib1g-dev libwmf-bin \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libdrm-dev libgbm-dev libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libvulkan-dev libdbus-1-dev libibus-1.0-dev libudev-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            xvfb xauth openbox x11-utils poppler-utils cups-client
      - name: Qualify native resource ownership with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cmake --preset sdl-sanitize
          cmake --build --preset sdl-sanitize --target stars-compat-images stars-compat-font stars-compat-print stars-resource-faults stars-resource-glyphs stars-resource-audio stars-resource-guards stars-resource-modal stars-resource-messagebox stars-compat-exceptions stars-compat-paint-batch stars-resource-list stars-resource-combo stars-resource-toolbar stars-resource-controls stars-resource-profile stars-compat-bitmap stars-compat-drawing-state stars-compat-palette stars-compat-menu stars-compat-popup stars-compat-menubar stars-compat-file stars-compat-memory --parallel 2 -- -k 0
          ctest --test-dir dist/sdl-sanitize -R '^win32_(images|font|print|print_pdf|bitmap|drawing_state|palette|menu|popup|menubar|file|memory|exception_callbacks|sdl_paint_batch|sdl_resource_(faults|glyphs|guards|modal|messagebox|list|combo|toolbar|controls|profile|audio_.*))$' --output-on-failure

  source-witnesses:
    name: Source witnesses (C++20)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - name: Run independent simulation and workflow vectors
        run: |
          result=0
          for witness in tests/spec/check_*_source.py; do
            python "$witness" || result=1
          done
          exit "$result"

  # The unit tests that need no windows, built natively with gcc.
  host-linux:
    name: Unit tests (stars-host, Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build \
            python3-pip python3-venv python3-yaml

      - name: Build and run unit tests
        run: make test-host

  windows-sdl:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-python-yaml
            mingw-w64-ucrt-x86_64-sdl3 mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-fontconfig mingw-w64-ucrt-x86_64-cairo
            mingw-w64-ucrt-x86_64-libwmf
      - name: Build and test the Windows SDL client
        shell: msys2 {0}
        run: |
          # Use MSYS2 Python so CMake can create the build-local environment.
          # Both suites share contract targets; configure their combined registry.
          cmake --preset windows-sdl-debug -DSTARS_BUILD_TESTS=ON -DSTARS_BUILD_WIN32_REFERENCE_TESTS=ON -DPython3_EXECUTABLE="$(cygpath -m "$MINGW_PREFIX/bin/python.exe")"
          cmake --build --preset windows-sdl-debug --target stars-sdk-reference-build --parallel 2 -- -k 0
          ctest --test-dir dist/windows-sdl-debug -R '^(test_win32_abi_reference|test_nativeui_points_reference)$' --output-on-failure
          cmake --preset windows-sdl-debug -DSTARS_BUILD_TESTS=OFF -DSTARS_BUILD_WIN32_REFERENCE_TESTS=ON -DPython3_EXECUTABLE="$(cygpath -m "$MINGW_PREFIX/bin/python.exe")"
          cmake --preset windows-sdl-debug -DSTARS_BUILD_TESTS=OFF -DSTARS_BUILD_WIN32_REFERENCE_TESTS=OFF -DPython3_EXECUTABLE="$(cygpath -m "$MINGW_PREFIX/bin/python.exe")"
          cmake --preset windows-sdl-debug -DSTARS_BUILD_TESTS=ON -DSTARS_BUILD_WIN32_REFERENCE_TESTS=OFF -DPython3_EXECUTABLE="$(cygpath -m "$MINGW_PREFIX/bin/python.exe")"
          cmake --build --preset windows-sdl-debug --parallel 2 -- -k 0
          ctest --test-dir dist/windows-sdl-debug -R '^test_' --output-on-failure
          ctest --preset windows-sdl-headless
