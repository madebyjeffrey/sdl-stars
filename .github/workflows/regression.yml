name: Stars native regression

on:
  # Platform CI is temporarily opt-in; run it manually when needed.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Regression (${{ matrix.scenario }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Scenarios covered by the checked-in native baseline
        # (tests/scaffold/fixtures/regression/native/run.json).
        scenario: [noai, oneai1, oneai2, oneai3, oneai4, oneai5, oneai6, smallai4, smallai6]
    env:
      SCENARIO: ${{ matrix.scenario }}
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      STARS_SDL_RENDERER: software
      STARS_FILE_DIALOG_BACKEND: compat
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: tests/savecli/go.mod
          cache-dependency-path: tests/savecli/go.sum

      - name: Install SDL build dependencies
        run: |
          sudo apt-get update
          # Keep SDL's optional desktop backends buildable; see docs/SDL3-DEVELOPMENT.md.
          sudo apt-get install -y cmake ninja-build pkg-config python3-pip python3-venv python3-yaml \
            libfreetype-dev libfontconfig-dev libcairo2-dev zlib1g-dev libwmf-bin \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libdrm-dev libgbm-dev libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libvulkan-dev libdbus-1-dev libibus-1.0-dev libudev-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            xvfb xauth openbox x11-utils poppler-utils cups-client

      - name: Build SDL client and save CLI
        run: |
          cmake --preset sdl-release -B dist/regression-build
          cmake --build dist/regression-build --target stars-sdl --parallel 2
          make save-cli

      - name: Generate native checkpoints through turn 150
        run: |
          mkdir -p dist/scaffold/regression
          python3 tests/scaffold/regression.py prepare --seed 12345 \
            --exe dist/regression-build/bin/stars-sdl --work dist/scaffold/regression/native
          python3 tests/scaffold/regression.py run --work dist/scaffold/regression/native \
            --scenario "$SCENARIO" --through 150 --timeout 300

      - name: Compare against native baseline
        run: |
          python3 tests/scaffold/regression.py compare \
            tests/scaffold/fixtures/regression/native dist/scaffold/regression/native \
            --scenario "$SCENARIO" --through 150 --report dist/scaffold/regression/comparison.json

      - name: Show first difference on failure
        if: failure()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = Path('dist/scaffold/regression/comparison.json')
          if report.is_file():
              for result in json.loads(report.read_text()):
                  if not result.get('match', False) and 'skipped' not in result:
                      print(f"{result['scenario']}: turn {result['turn']}, {result.get('file', '')}")
                      print(result.get('detail', result.get('error', 'comparison failed')))
                      break
          PY

      - name: Retain regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ matrix.scenario }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/scaffold/regression/
          if-no-files-found: warn
          retention-days: 30

  # The same scenarios and baseline through stars-host built natively with
  # gcc on x86-64 Linux, without Wine.
  host-linux:
    name: Regression (stars-host, Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: tests/savecli/go.mod
          cache-dependency-path: tests/savecli/go.sum

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build \
            python3-pip python3-venv python3-yaml

      - name: Generate and compare all scenarios through turn 150
        run: make regression-host

      - name: Retain regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-host-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/scaffold/regression/
          if-no-files-found: warn
          retention-days: 30
