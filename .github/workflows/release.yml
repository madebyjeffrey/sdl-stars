name: Build and release Stars!

on:
  push:
    branches: [main]
    tags: ['**', '!latest']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-sdl:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-python-yaml
            mingw-w64-ucrt-x86_64-sdl3 mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-fontconfig mingw-w64-ucrt-x86_64-cairo
            mingw-w64-ucrt-x86_64-libwmf
      - name: Build and test the Windows SDL client
        shell: msys2 {0}
        run: |
          # CMake otherwise prefers the runner Python, which lacks MSYS2 PyYAML.
          cmake --preset windows-sdl-debug -DPython3_EXECUTABLE="$(cygpath -m "$MINGW_PREFIX/bin/python.exe")"
          cmake --build --preset windows-sdl-debug --parallel 2
          ctest --preset windows-sdl-headless
      - name: Build and package Release
        shell: msys2 {0}
        run: |
          # CMake otherwise prefers the runner Python, which lacks MSYS2 PyYAML.
          cmake --preset windows-sdl-release -DPython3_EXECUTABLE="$(cygpath -m "$MINGW_PREFIX/bin/python.exe")"
          cmake --build --preset windows-sdl-release --parallel 2
          cmake --install dist/windows-sdl-release --prefix "$PWD/dist/windows-portable" --component StarsRuntime
      - name: Archive portable Windows runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/release | Out-Null
          Compress-Archive -Path dist/windows-portable/* -DestinationPath dist/release/stars-sdl-windows-x64.zip
          Copy-Item dist/windows-sdl-release/generated/version.h dist/release/version.h
      - uses: actions/upload-artifact@v4
        with:
          name: windows-sdl-runtime
          path: dist/release/
          if-no-files-found: error
  release:
    needs: windows-sdl
    if: github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && github.ref_name != 'latest')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          # cmake/version.cmake numbers builds from the last vX.Y.Z tag.
          fetch-depth: 0
          fetch-tags: true

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build python3-yaml

      - uses: actions/download-artifact@v4
        with:
          name: windows-sdl-runtime
          path: dist/release/
      - name: Read and validate product version
        run: |
          version=$(sed -n 's/^#define STARS_VERSION_STRING "\(.*\)"$/\1/p' dist/release/version.h)
          display=$(sed -n 's/^#define STARS_VERSION_DISPLAY "\(.*\)"$/\1/p' dist/release/version.h)
          echo "Built Stars! $display"
          echo "STARS_VERSION=$version" >> "$GITHUB_ENV"
          echo "STARS_DISPLAY=$display" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ \
                && "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::tag $GITHUB_REF_NAME built version $version"
            exit 1
          fi

      # stars-host, the game's host without windows, for x86-64 Linux. The
      # core uses binary64 arithmetic, matching the SDL client.
      # It links statically so it runs on older glibc. Refs from before
      # 2.9 have no host preset and publish only stars.exe.
      - name: Build Linux stars-host
        run: |
          if ! cmake --list-presets | grep -q '"host-release"'; then
            echo "No host-release preset at this ref; skipping stars-host."
            exit 0
          fi
          cmake --preset host-release -DCMAKE_EXE_LINKER_FLAGS=-static
          cmake --build --preset host-release --parallel 2
          (cd dist/host-release && ctest --output-on-failure --timeout 300)
          file dist/host-release/bin/stars-host
          dist/host-release/bin/stars-host --version
          tar -C dist/host-release/bin -czf dist/release/stars-host-linux-x64.tar.gz stars-host
          echo "STARS_HOST_ASSET=dist/release/stars-host-linux-x64.tar.gz" >> "$GITHUB_ENV"

      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stars-windows-x64-${{ github.sha }}
          path: |
            dist/release/stars-sdl-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Save Linux stars-host artifact
        if: env.STARS_HOST_ASSET != ''
        uses: actions/upload-artifact@v4
        with:
          name: stars-host-linux-x64-${{ github.sha }}
          path: ${{ env.STARS_HOST_ASSET }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          commit=$(git rev-parse HEAD)
          assets=(dist/release/stars-sdl-windows-x64.zip)
          if [[ -n "${STARS_HOST_ASSET:-}" ]]; then
            assets+=("$STARS_HOST_ASSET")
          fi
          if [[ "$GITHUB_REF_TYPE" == branch ]]; then
            # An older queued build must not replace a newer main build.
            main_commit=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
            if [[ "$commit" != "$main_commit" ]]; then
              echo "Main has advanced; retaining this build as an artifact only."
              exit 0
            fi
            tag=latest
            existing_ref=$(gh api "repos/$GH_REPO/git/matching-refs/tags/latest" \
              --jq '.[] | select(.ref == "refs/tags/latest") | .ref')
            if [[ -n "$existing_ref" ]]; then
              gh api --method PATCH "repos/$GH_REPO/git/refs/tags/latest" \
                -f sha="$commit" -F force=true --silent
            else
              gh api --method POST "repos/$GH_REPO/git/refs" \
                -f ref=refs/tags/latest -f sha="$commit" --silent
            fi
            cat > dist/release/notes.md <<EOF
          Stars! $STARS_DISPLAY: Windows x86-64 optimized Release build, built from main.

          Extract stars-sdl-windows-x64.zip and run bin/stars-sdl.exe.

          stars-host-linux-x64.tar.gz holds stars-host, the game's host without
          windows, for x86-64 Linux. It takes stars.exe's host command line
          (-a, -g, -v, -b, -t, -s) and generates the same turns.

          Commit: $commit
          Build: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
          else
            tag="$GITHUB_REF_NAME"
          fi

          release_tags=$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name')
          release_exists=false
          if grep -Fxq -- "$tag" <<< "$release_tags"; then
            release_exists=true
          fi
          if [[ "$tag" == latest ]]; then
            if [[ "$release_exists" == true ]]; then
              gh release edit "$tag" --title "Latest development build ($STARS_VERSION)" \
                --prerelease --latest=false --notes-file dist/release/notes.md
              gh release upload "$tag" "${assets[@]}" --clobber
            else
              gh release create "$tag" --verify-tag --title "Latest development build ($STARS_VERSION)" \
                --prerelease --latest=false --notes-file dist/release/notes.md \
                "${assets[@]}"
            fi
          elif [[ "$release_exists" == true ]]; then
            # Allow a failed tag run to be retried without creating another release.
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            title="$tag"
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              title="Stars! $STARS_DISPLAY"
            fi
            gh release create "$tag" --verify-tag --title "$title" --generate-notes \
              "${assets[@]}"
          fi
